# Gruvbox Dark-inspired Starship prompt

# 主格式（双行）
# Gruvbox Dark-inspired Starship prompt

format = """
$custom.env$character
"""
[custom.env]
command = "echo '[nix-dev]'"
when = 'test -n "$IN_NIX_SHELL"'
format = "[$output]($style) "
style = "bold #b8bb26"
require_repo = false

# 输入符号
[character]
success_symbol = "[❯](#b8bb26 bold)"
error_symbol = "[✗](#cc241d bold)"
vimcmd_symbol = "[❮](#fe8019 bold)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #83a598"
disabled = true

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "#fe8019"
disabled = true

# 目录
[directory]
style = "bold #b8bb26"
truncate_to_repo = false
truncation_length = 3
disabled = true


# 执行时间（超过阈值才显示）
[cmd_duration]
min_time = 500  # ms
format = "[took $duration](#d3869b)"
style = "bold"

# Shell 类型（可选）
[shell]
fish_indicator = "󰈺 "
bash_indicator = " "
style = "#928374"

# 内置工具提示样式
[python]
symbol = " "
style = "#8ec07c"

[nodejs]
symbol = " "
style = "#b8bb26"

[package]
symbol = " "
style = "#fe8019"

[c]
symbol = " "
style = "bg:#3B4252"
format = '[ $symbol ($version) ]($style)'

