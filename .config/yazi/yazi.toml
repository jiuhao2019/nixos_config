[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
wrap       = "no"
tab_size   = 4
max_width  = 1200
max_height = 1800

[opener]
edit = [
    { run = '${EDITOR:-vi} "$@"', block = true, for = "unix" },
]

open = [
    { run = 'xdg-open "$1"', orphan = true, desc = "Open", for = "linux" },
]

reveal = [
    { run = 'xdg-open "$(dirname "$1")"', orphan = true, desc = "Reveal", for = "linux" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },

    { url = "*.c",    use = "edit" },
    { url = "*.h",    use = "edit" },
    { url = "*.cpp",  use = "edit" },
    { url = "*.hpp",  use = "edit" },
    { url = "*.lua",  use = "edit" },
    { url = "*.nix",  use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.json", use = "edit" },
    { url = "*.md",   use = "edit" },
    { url = "*.org",  use = "edit" },

    { mime = "image/*",       use = "open" },
    { mime = "video/*",       use = "open" },
    { mime = "audio/*",       use = "open" },
    { mime = "application/pdf", use = "open" },
]
