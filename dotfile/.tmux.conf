# 改前缀
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# 改成 prefix+ e 来新建窗口
unbind c
bind e new-window
bind-key x kill-pane
bind-key X kill-session

set -gq allow-passthrough on
set -g visual-activity off
set-option -sg escape-time 10
set-option -g focus-events on

# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "tmux-256color"
set -as terminal-features 'st:RGB'
set -g terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[4 q'
set -as terminal-features '*:Ss=\E[%p1%d q:Se=\E[ q'
# split panes using | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
setw -g mode-keys vi
set -g display-panes-time 6000
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# don't rename windows automatically
set-option -g allow-rename off

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
# 设置 tmux 复制模式使用 xclip
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard"
# 设置 tmux 复制模式使用 xclip（针对标准的复制模式）
bind-key y run "tmux save-buffer - | xclip -selection clipboard"
# 将系统剪贴板内容粘贴到 tmux 中
bind-key p run "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer -p"

set -g default-shell "$SHELL"
set-option -g default-command "$SHELL"

 set -g @plugin "adibhanna/gruvbox-tmux"
 set -g @gruvbox-theme dark-soft
 set -g @gruvbox-tmux_show_path 1
 set -g @gruvbox-tmux_path_format absolute
 set -g @gruvbox-tmux_github_status off
 set -g @gruvbox-tmux_window_id_style digital
 set -g @gruvbox-tmux_pane_id_style sub
 set -g @gruvbox-tmux_zoom_id_style super

 run-shell ~/.tmux/plugins/gruvbox-tmux/gruvbox.tmux
